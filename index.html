<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bio-Óleo | Acesso às telas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --preto: #000;
      --ouro: #FFD21F;
      --ambar: #C77B0A;
      --ambar-escuro: #8A5206;
      --texto: #F4EFE3;
      --texto-suave: #BDB398;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--preto);
      color: var(--texto);
      font-family: "Montserrat", system-ui, sans-serif;
      overflow-x: hidden;
      position: relative;
    }
    /* Círculos de fundo, no mesmo estilo do site */
    body::before, body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      width: min(78vmin, 760px);
      height: min(78vmin, 760px);
      right: -12vmin;
      top: -10vmin;
      background: radial-gradient(circle at 35% 35%, #D58A12, var(--ambar) 55%, var(--ambar-escuro));
      opacity: .55;
    }
    body::after {
      width: min(40vmin, 380px);
      height: min(40vmin, 380px);
      left: -8vmin;
      bottom: -14vmin;
      background: radial-gradient(circle at 40% 30%, #B8730C, var(--ambar-escuro));
      opacity: .6;
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      display: block;
      height: clamp(150px, 26vh, 230px);
      width: auto;
      margin-bottom: 28px;
      filter: drop-shadow(0 12px 28px rgba(255, 210, 31, .25));
    }
    h1 {
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 800;
      line-height: 1.1;
      color: var(--texto);
    }
    .sub {
      margin-top: 10px;
      font-size: 1rem;
      color: var(--texto-suave);
    }
    nav {
      margin-top: 36px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    nav a {
      width: min(100%, 340px);
      padding: 15px 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      transition: transform .18s ease, background-color .18s ease, color .18s ease, border-color .18s ease;
    }
    .principal {
      background: linear-gradient(180deg, #FFD21F, #FFC400);
      color: #1A1200;
      border: 2px solid transparent;
    }
    .principal:hover { transform: translateY(-2px); background: #FFE15C; }
    .secundario {
      background: rgba(0, 0, 0, .45);
      color: var(--texto);
      border: 2px solid var(--texto);
      backdrop-filter: blur(6px);
    }
    .secundario:hover { transform: translateY(-2px); background: var(--texto); color: #000; }
    nav a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      nav a { transition: none; }
      nav a:hover { transform: none; }
    }
  </style>
</head>
